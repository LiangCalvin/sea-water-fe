<div class="position-selector">
  <div class="selector-label">
    <label class="form-label" for="positionSelect">Select position</label>
  </div>
  <div class="selector-dropdown">
    <app-dropdown [id]="'positionSelect'" [placeholder]="'Choose group'" [defaultSelected]="getSelectedOption()"
      [options]="dropdownOptions" [isRequired]="true" (selectChange)="onDropdownChange($event)"></app-dropdown>
  </div>
</div>
