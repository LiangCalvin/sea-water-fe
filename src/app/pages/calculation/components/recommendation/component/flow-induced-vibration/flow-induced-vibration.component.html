<div *ngFor="let data of details">
    <div *ngIf="data.title === title">
        <div *ngFor="let item of data.items">
            <div *ngIf="item.type === 'flow_induced_vibration'">
                <div class="m-[10px]">
                    <ng-container>
                        <div class="p-[10px]">
                            <div class="container-content">
                                <span class="text-title">{{'LOF:'}}</span>
                                @if(item.details){
                                    <span class="text">{{ formatValue(item.details, 'LOF')}} </span>
                                }@else{
                                    <span class="text">{{`can't calculation LOF`}}</span>
                                }
                            </div>
                            <div class="container-content">
                                <span class="text-title">{{'Criteria:'}}</span>
                                <div class="flex-column">
                                    <span class="text">{{`Pass: LOF < 0.3`}}</span>
                                    <span class="text">{{`Fail: LOF >= 0.3`}}</span>
                                </div>
                            </div>
                        </div>
                    </ng-container>
                    <div class="container-recommendation p-[10px]">
                        <span class="text-title">{{'Recommendation:'}}</span>
                        @if(item.status === 'TRUE'){
                        <span class="text">{{'-'}}</span>
                        }@else {
                        <table border="1">
                            <thead>
                                <th class="" *ngFor="let column of columnData">
                                    <span class="text-table-header line">{{column.label}} </span>
                                </th>
                            </thead>
                            <tbody>
                                <tr *ngFor="let data of recommendData">
                                    <td class="text-table-content">{{data.lof}}</td>
                                    <td class="text-table-action">{{data.actions}}</td>
                                </tr>
                            </tbody>
                        </table>
                        }
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
