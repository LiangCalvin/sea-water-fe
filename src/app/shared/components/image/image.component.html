<div class="image-wrapper">
  <ng-container *ngIf="!isError; else fallbackTemplate">
    <img [src]="src" [alt]="alt" [style.object-fit]="fit" [style.width.px]="width" [style.height.px]="height"
      [loading]="loading" (load)="handleLoad()" (error)="handleError()" [class.hidden]="isLoading" />

    <div *ngIf="isLoading" class="skeleton"></div>
  </ng-container>

  <ng-template #fallbackTemplate>
    <img [src]="fallbackSrc" alt="fallback image" />
  </ng-template>
</div>
